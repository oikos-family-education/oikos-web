# Installers for a few known families: NSIS for Windows x64 (unsigned) and a DMG per Mac
# architecture (ad-hoc signed). No Developer ID, no notarization.
# Build with `npm run desktop:build` from the repo root (see scripts/build-desktop.mjs).
appId: family.oikos.desktop
productName: Oikos
copyright: Copyright © Oikos contributors

directories:
  # Not dist/: tsc writes the app's own JavaScript there
  output: release

files:
  - dist/**/*.js
  - package.json

# Not packed into app.asar: embedded-postgres spawns initdb, postgres and pg_ctl from
# node_modules/@embedded-postgres/<platform>/native, and finds share/ and lib/ next to them.
# Executables inside app.asar can't be spawned, and asarUnpack would leave the resolved
# paths pointing into app.asar.
asar: false

# No native modules to rebuild; the bundled programs are already built for the target.
npmRebuild: false

# Must match resolvePaths() in src/paths.ts (tests/electronBuilder.test.ts checks this).
extraResources:
  # PyInstaller onedir build (apps/api/desktop/oikos-api.spec)
  - from: ../api/dist/oikos-api
    to: api
    filter: ['**/*']
  # Next.js standalone server, static assets included (apps/web/scripts/build-desktop.mjs)
  - from: ../web/.next-desktop/standalone
    to: web
    filter: ['**/*']
  # electron-builder always drops a node_modules folder at the root of a `from`, so the
  # standalone server's dependencies need their own entry.
  - from: ../web/.next-desktop/standalone/node_modules
    to: web/node_modules
    filter: ['**/*']
  # pg_dump and the libraries it loads (scripts/fetch-pg-dump.mjs)
  - from: .pg-dump
    to: postgres
    filter: ['**/*']

publish: null

# Windows: copies the VC++ runtime next to postgres.exe and pg_dump.exe (scripts/vc-runtime.mjs)
afterPack: ./scripts/after-pack.mjs

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  artifactName: ${productName} Setup ${version}.${ext}

mac:
  # Ad-hoc signed ("-"): no Developer ID and no notarization, so families open it once with
  # System Settings > Privacy & Security > Open Anyway. Apple Silicon refuses to run a modified bundle that isn't signed at all.
  identity: '-'
  # Hardened runtime only matters for notarization; with an ad-hoc signature its library
  # validation would stop Postgres and the API from loading their own libraries.
  hardenedRuntime: false
  category: public.app-category.education
  # One DMG per architecture: the bundled API and Postgres binaries are built for one CPU.
  # The architecture is the build machine's (scripts/build-desktop.mjs passes --arm64 or --x64).
  target: dmg

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
